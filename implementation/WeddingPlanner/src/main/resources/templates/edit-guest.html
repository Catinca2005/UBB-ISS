<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventStudio - Edit Guest</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('/background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .body-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(253, 251, 247, 0.85); z-index: -1;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

<div class="body-overlay"></div>

<div class="card p-12 shadow-2xl max-w-xl w-full mx-4 border border-rose-100">
    <div class="text-center mb-8">
        <h1 class="font-serif text-3xl text-gray-800 mb-2">Edit Guest</h1>
        <p class="text-sm text-gray-500 uppercase tracking-widest" th:text="${event.name}">Event Name</p>
    </div>

    <form th:action="@{/events/{eventId}/guests/{guestId}/edit(eventId=${event.id}, guestId=${guest.id})}" method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <!-- Display current photo if it exists -->
        <div class="flex justify-center mb-6" th:if="${guest.photoFilename != null}">
            <div class="relative">
                <img th:src="@{/uploads/guests/{filename}(filename=${guest.photoFilename})}" alt="Current Photo" class="w-24 h-24 rounded-full object-cover border-4 border-rose-100 shadow-sm">
                <span class="absolute -bottom-2 bg-white text-xs px-2 py-0.5 rounded-full border border-gray-200 text-gray-500 shadow-sm">Current Photo</span>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1 ml-1">Guest Name *</label>
            <input type="text" name="name" th:value="${guest.name}" required placeholder="e.g. John Doe"
                   class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-[#C87D87] focus:border-[#C87D87] transition-colors text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1 ml-1">RSVP Status</label>
            <select name="rsvpStatus" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-[#C87D87] focus:border-[#C87D87] transition-colors text-sm bg-white">
                <option value="Pending" th:selected="${guest.rsvpStatus == 'Pending'}">Pending</option>
                <option value="Attending" th:selected="${guest.rsvpStatus == 'Attending'}">Attending</option>
                <option value="Declined" th:selected="${guest.rsvpStatus == 'Declined'}">Declined</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1 ml-1">Dietary Preferences</label>
            <input type="text" name="dietaryPreferences" th:value="${guest.dietaryPreferences}" placeholder="e.g. Vegetarian, Nut Allergy"
                   class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-[#C87D87] focus:border-[#C87D87] transition-colors text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1 ml-1">Update Photo (Leave empty to keep current)</label>
            <input type="file" name="photo" accept="image/*"
                   class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-[#C87D87] focus:border-[#C87D87] transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-[#C87D87] hover:file:bg-rose-100 cursor-pointer">
        </div>

        <div class="flex gap-4 mt-8">
            <a th:href="@{/events/{eventId}/guests(eventId=${event.id})}" class="w-1/3 py-3.5 text-center text-gray-600 font-semibold rounded-full hover:bg-gray-100 transition-all text-sm flex items-center justify-center">Cancel</a>
            <button type="submit" class="w-2/3 py-3.5 bg-[#C87D87] text-white rounded-full font-semibold shadow-lg hover:bg-[#b86a76] transition-all text-sm">
                Update Guest
            </button>
        </div>
    </form>
</div>

</body>
</html>
